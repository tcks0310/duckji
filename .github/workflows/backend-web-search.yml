# 백엔드 web-search 서비스: 이 서비스 코드나 공통 코드(shared)가 바뀔 때만 실행
name: backend-web-search

on:
  push:
    branches: [main]
    paths:
      - "backend/src/services/web-search/**"
      - "backend/src/shared/**"
      - "backend/package.json"
      - "backend/scripts/**"
      - "package-lock.json"
      - ".github/workflows/backend-web-search.yml"
      - ".github/workflows/backend-service.yml"
  pull_request:
    paths:
      - "backend/src/services/web-search/**"
      - "backend/src/shared/**"
      - "backend/package.json"
      - "backend/scripts/**"
      - "package-lock.json"
      - ".github/workflows/backend-web-search.yml"
      - ".github/workflows/backend-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-web-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-cd:
    uses: ./.github/workflows/backend-service.yml
    with:
      service: web-search
    secrets: inherit
