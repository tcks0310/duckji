# 모바일 앱(mobile/, Expo): push 때는 타입 검사만, 빌드는 Actions 탭에서 직접 실행
# 실제 빌드는 Expo 서버(EAS)가 함. 무료 한도가 한 달 30번이라 버전 올릴 때만 실행
# 필요: 저장소 비밀값 EXPO_TOKEN (Expo duckji_siaa 조직의 로봇 사용자 토큰)
name: mobile

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      platform:
        description: 빌드할 기기 (ios 는 애플 개발자 가입 뒤)
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: preview = 테스트용 설치 파일(안드로이드 APK), production = 스토어 제출용
        type: choice
        options: [preview, production]
        default: preview
      check_only:
        description: 빌드 없이 Expo 연결(토큰)과 최근 빌드 결과만 확인
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  build:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Expo 연결 확인
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error title=expo::EXPO_TOKEN 비밀값이 없습니다"; exit 1; fi
          npm i -g eas-cli@latest --silent 2>/dev/null
          who=$(eas whoami 2>/dev/null) || { echo "::error title=expo::토큰으로 로그인 실패"; exit 1; }
          echo "::notice title=expo::Expo 연결됨 ($(echo "$who" | grep -v '^$' | tr '\n' ' '))"
      - name: 빌드 (Expo 서버)
        if: ${{ !inputs.check_only }}
        run: |
          set +e
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --wait --json > build.json 2> build.err
          code=$?
          tail -40 build.err
          if [ $code -ne 0 ]; then
            msg=$(grep -v '^\s*$' build.err | tail -12 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build-failed::$msg"
            exit 1
          fi
      - name: 최근 빌드 결과 (설치 링크)
        if: ${{ always() }}
        run: |
          eas build:list --limit 3 --json --non-interactive > list.json 2>/dev/null || exit 0
          node -e '
            const list = JSON.parse(require("fs").readFileSync("list.json", "utf8"))
            for (const b of list) {
              const page = `https://expo.dev/accounts/duckji_siaa/projects/duckji/builds/${b.id}`
              const err = b.error ? ` | 오류 ${b.error.errorCode}: ${b.error.message}` : ""
              console.log(`::notice title=build-${b.platform}-${b.buildProfile}::${b.status} ${b.createdAt} 설치 파일 ${b.artifacts?.buildUrl || b.artifacts?.applicationArchiveUrl || "없음"} | 빌드 화면 ${page}${err}`)
            }'
      - name: 실패한 빌드의 오류 줄 (최근 실패 1건)
        if: ${{ always() }}
        run: |
          [ -f list.json ] || exit 0
          id=$(node -e 'const l=JSON.parse(require("fs").readFileSync("list.json","utf8")).find(b=>b.status==="ERRORED");console.log(l?l.id:"")')
          [ -n "$id" ] || exit 0
          eas build:view "$id" --json > view.json 2>/dev/null || exit 0
          node -e 'for (const u of JSON.parse(require("fs").readFileSync("view.json","utf8")).logFiles || []) console.log(u)' > logs.txt
          : > all.log
          while read -r u; do curl -sSL -o part "$u"; if gzip -t part 2>/dev/null; then gunzip -c part; elif zstd -t part 2>/dev/null; then zstd -dc part; elif brotli -t part 2>/dev/null; then brotli -dc part; else cat part; fi >> all.log; echo >> all.log; done < logs.txt
          # 로그는 JSON 줄이라 msg 만 꺼냄
          node -e '
            const lines = require("fs").readFileSync("all.log","utf8").split("\n")
            const msgs = lines.map(l => { try { return JSON.parse(l).msg ?? "" } catch { return l } }).join("\n").split("\n")
            const hits = []
            msgs.forEach((m, i) => { if (/issues were found when checking AAR|error:|e: file|Unresolved reference/.test(m)) hits.push(msgs.slice(i, i + 12).join(" | ")) })
            const uniq = [...new Set(hits)].slice(0, 15)
            for (const h of uniq) console.log(`::warning title=build-log::${h.replace(/%/g,"%25").slice(0, 3000)}`)
            if (!uniq.length) console.log(`::warning title=build-log::오류 줄 못 찾음, 마지막 줄: ${msgs.filter(Boolean).slice(-8).join(" | ").slice(0, 900)}`)'
      - name: 안드로이드 앱 서명값 (카카오·네이버·구글 콘솔 등록용)
        if: ${{ always() }}
        run: |
          [ -f list.json ] || exit 0
          url=$(node -e 'const l=JSON.parse(require("fs").readFileSync("list.json","utf8")).find(b=>b.platform==="ANDROID"&&b.status==="FINISHED"&&b.artifacts?.buildUrl);console.log(l?l.artifacts.buildUrl:"")')
          [ -n "$url" ] || exit 0
          curl -sSL -o app.apk "$url"
          # v2 서명만 있는 APK 라 keytool 대신 안드로이드 SDK 의 apksigner 로 읽음
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          cert=$("$signer" verify --print-certs app.apk)
          hex1=$(echo "$cert" | grep -m1 'SHA-1 digest' | awk '{print $NF}')
          hex256=$(echo "$cert" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          colon() { echo "$1" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//'; }
          sha1=$(colon "$hex1"); sha256=$(colon "$hex256")
          keyhash=$(echo "$hex1" | xxd -r -p | base64)
          echo "::notice title=android-signing::패키지 com.duckji.app | SHA-1 $sha1 | SHA-256 $sha256 | 카카오 키 해시 $keyhash"
